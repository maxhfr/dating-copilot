# Hard filters. A profile failing ANY of these is rejected before it is
# ever scored. Age, distance and height are enforced in code (judge.py),
# not by the model — it kept rejecting profiles inside the range.

age:
  min: 26
  max: 34

distance_km_max: 20

language:
  required_any: [french, english]
  prefer: french
  # If no language is stated on the profile, assume French (Paris-based).
  assume_if_unstated: french

smoking:
  # Disabled. Not a dealbreaker either way.
  reject_if_anti_smoking: false

drinking:
  # Disabled. Non-drinkers are fine.
  reject_if_teetotal: false

height:
  # Only applied when height is explicitly stated on the profile.
  # Unstated = no filter, do not guess from photos.
  max_cm_if_stated: 173

body_type:
  reject_obese: true

profile_quality:
  min_photos: 2
  require_some_bio_or_prompt: true
  # Skip accounts that look inactive / abandoned.
  # Note: Tinder web does not expose last-active, so this only applies
  # where the platform provides it.
  max_days_inactive: 30

# --- Not evaluated ---
# Ethnicity, race and national origin are not inputs to this rubric or to
# the scoring, and must not be inferred by the model.
