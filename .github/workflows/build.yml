name: build

# Builds the Mac app and the Windows app on GitHub's servers and smoke-tests
# them. Run it by hand (Actions tab > build > Run workflow), push a tag like
# v0.1.0, or change packaging files on the working branch.
#
# To publish a download page (Releases) with both apps: Run workflow and type a
# version such as v0.1.0 in "release_tag" (or push a tag starting with v).
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Publish a GitHub Release with this tag (e.g. v0.1.0). Leave empty for a plain build."
        required: false
        default: ""
  push:
    tags: ["v*"]
    branches: [phase1-platform-interface]
    paths:
      - ".github/workflows/build.yml"
      - "packaging/**"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: "Unit tests (offline, no browser, no API calls)"
        run: |
          python test_parsers.py
          python test_session.py
          python test_app.py
          python test_schedule.py
          python test_packaging.py
          python test_matches.py
          python test_install.py
          python test_android_probe.py

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            name: mac
          - os: windows-latest
            name: windows
    runs-on: ${{ matrix.os }}
    env:
      # Mac signing is optional: without these secrets the build is unsigned.
      MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
    steps:
      - name: Use a throwaway app home for the smoke test
        shell: bash
        run: echo "DATING_COPILOT_HOME=$RUNNER_TEMP/dating-copilot-home" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt pyinstaller
      - name: Build
        run: pyinstaller --noconfirm --clean packaging/dating-copilot.spec

      - name: Import the Developer ID certificate
        if: runner.os == 'macOS' && env.MACOS_CERTIFICATE != ''
        env:
          MACOS_CERTIFICATE_PWD: ${{ secrets.MACOS_CERTIFICATE_PWD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PW="$(uuidgen)"
          echo "$MACOS_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$MACOS_CERTIFICATE_PWD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PW" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/cert.p12"

      - name: Sign and notarize the app
        if: runner.os == 'macOS' && env.MACOS_CERTIFICATE != ''
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: bash packaging/sign_and_notarize_mac.sh "dist/Dating Copilot.app"

      - name: Note that the Mac build is unsigned
        if: runner.os == 'macOS' && env.MACOS_CERTIFICATE == ''
        run: echo "::notice title=Unsigned Mac build::No MACOS_CERTIFICATE secret, so the app is not signed or notarized. Use install_mac.sh to install it without the Gatekeeper warning."

      - name: Smoke test (macOS)
        if: runner.os == 'macOS'
        run: |
          "dist/Dating Copilot.app/Contents/MacOS/dating-copilot" --check
          cat "$DATING_COPILOT_HOME/app.log"

      - name: Smoke test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # A windowed app returns at once in PowerShell, so wait for it.
          $p = Start-Process -FilePath "dist\dating-copilot\dating-copilot.exe" `
               -ArgumentList "--check" -Wait -PassThru
          Get-Content "$env:DATING_COPILOT_HOME\app.log"
          if ($p.ExitCode -ne 0) { throw "check failed with exit code $($p.ExitCode)" }

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: ditto -c -k --keepParent "dist/Dating Copilot.app" DatingCopilot-mac.zip

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist\dating-copilot -DestinationPath DatingCopilot-windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: DatingCopilot-${{ matrix.name }}
          path: DatingCopilot-*.zip
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.release_tag != ''
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: zips
          merge-multiple: true
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.release_tag || github.ref_name }}
        run: |
          cat > notes.md <<'NOTES'
          Unsigned apps for personal use.

          **Mac (Apple Silicon), easiest:** paste this in Terminal. It downloads the latest version, puts it in Applications and opens it, with no macOS warning:

          `curl -fsSL https://raw.githubusercontent.com/maxhfr/dating-copilot/main/install_mac.sh | bash`

          Or download `DatingCopilot-mac.zip` and unzip it. If macOS says "Apple could not verify", open System Settings > Privacy & Security and click Open Anyway, or run `xattr -dr com.apple.quarantine "Dating Copilot.app"`.

          **Windows:** download `DatingCopilot-windows.zip`, unzip it and run `dating-copilot.exe`. If Windows says it protected your PC, click More info, then Run anyway.

          On first launch the app downloads its browser (about 190 MB). Log into Tinder and add your Anthropic key in the Setup tab.
          NOTES
          gh release create "$TAG" zips/*.zip \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Dating Copilot $TAG" --notes-file notes.md --generate-notes
